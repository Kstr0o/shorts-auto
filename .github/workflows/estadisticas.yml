name: Estadisticas de los canales

# Cada dia recoge vistas, retencion, publico y comentarios de los 4 canales
# y los guarda en la rama `datos` (informe.md legible + historial.csv).
on:
  schedule:
    - cron: '30 6 * * *'   # 07:30 hora de Madrid (invierno)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  estadisticas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q google-api-python-client google-auth
      - name: Traer la rama datos
        run: |
          git fetch origin datos && git worktree add -B datos ../datos origin/datos \
            || (git worktree add --orphan -b datos ../datos)
      - name: Recoger
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_TONI_ES: ${{ secrets.YT_TOKEN_TONI_ES }}
          YT_TOKEN_TONI_EN: ${{ secrets.YT_TOKEN_TONI_EN }}
          YT_TOKEN_YSI_ES: ${{ secrets.YT_TOKEN_YSI_ES }}
          YT_TOKEN_YSI_EN: ${{ secrets.YT_TOKEN_YSI_EN }}
        run: python3 motor/estadisticas.py ../datos
      - name: Guardar en la rama datos
        run: |
          cd ../datos
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Estadisticas $(date -u +%F)" || exit 0
          git push origin datos
