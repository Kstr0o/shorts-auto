name: Publicar Shorts

on:
  # La publicacion diaria se activa cuando los canales esten conectados:
  # schedule:
  #   - cron: '0 12 * * *'   # 13:00 hora de Madrid (invierno)
  #   - cron: '0 18 * * *'   # 19:00 hora de Madrid: 2 episodios al dia por canal
  workflow_dispatch:
    inputs:
      solo_render:
        description: 'Solo generar los videos, sin subirlos (1 = si)'
        default: '1'
      idiomas:
        description: 'Idiomas a generar en modo prueba (es,en)'
        default: 'es,en'
      solo_ep:
        description: 'Generar solo este episodio en modo prueba (p. ej. ep002); vacio = todos'
        default: ''

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2
          pip install -q -r requirements.txt
          # motor expresivo en CPU: torch sin CUDA para no llenar el disco
          pip install -q --no-cache-dir torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu || echo "torch no disponible"
          pip install -q --no-cache-dir chatterbox-tts faster-whisper || echo "motor expresivo no disponible"
          python3 -c "import torch, chatterbox, faster_whisper; print('motor expresivo listo', torch.__version__)" || true
          df -h / | tail -1
          mkdir -p ~/.fonts && cp assets/fuentes/*.ttf ~/.fonts/ && fc-cache -f
          mkdir -p voces && cd voces
          curl -sSL https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-es-carlfm-x-low.tar.gz | tar xz
          curl -sSL https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-en-us-ryan-high.tar.gz | tar xz
      - name: Generar y subir
        env:
          DIR_PIPER: ${{ github.workspace }}/voces
          SOLO_RENDER: ${{ github.event.inputs.solo_render || '0' }}
          TODOS: ${{ github.event.inputs.solo_render }}
          IDIOMAS: ${{ github.event.inputs.idiomas || 'es,en' }}
          SOLO_EP: ${{ github.event.inputs.solo_ep }}
          YT_PRIVACIDAD: ${{ vars.YT_PRIVACIDAD || 'private' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_TONI_ES: ${{ secrets.YT_TOKEN_TONI_ES }}
          YT_TOKEN_TONI_EN: ${{ secrets.YT_TOKEN_TONI_EN }}
          YT_TOKEN_YSI_ES: ${{ secrets.YT_TOKEN_YSI_ES }}
          YT_TOKEN_YSI_EN: ${{ secrets.YT_TOKEN_YSI_EN }}
        run: python3 motor/publicar_hoy.py
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: salida/*.mp4
          retention-days: 7
      - name: Dejar las pruebas en la rama pruebas
        if: ${{ github.event.inputs.solo_render == '1' }}
        run: |
          mkdir -p /tmp/pr && cp salida/*.mp4 salida/*.json /tmp/pr/
          # una rama por episodio (y por idioma si solo se genera uno) para que los runs en paralelo no se pisen
          RAMA="pruebas${{ github.event.inputs.solo_ep }}"
          if [ "${{ github.event.inputs.idiomas }}" != "es,en" ]; then RAMA="${RAMA}_${{ github.event.inputs.idiomas }}"; fi
          cd /tmp/pr && git init -q -b "$RAMA"
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Videos de prueba"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$RAMA"
      - name: Guardar estado
        if: ${{ github.event.inputs.solo_render != '1' }}
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add estado.json && git commit -m "Actualizar estado de publicacion" || true
          git push
