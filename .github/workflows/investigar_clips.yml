name: Investigar canales de clips

# Solo lectura: compara los Shorts de los canales de clips grandes con los clips top de Twitch (clipper/investigar.py).
# Se lanza al tocar el script en la rama de trabajo; no sube nada ni escribe en ninguna rama.
on:
  push:
    branches: ['claude/**']
    paths: ['clipper/investigar.py', '.github/workflows/investigar_clips.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        key: [kaicenat, lacy, clix, yourrage, asianjeff, boeshi, bobbyvanriper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q -U yt-dlp curl_cffi faster-whisper numpy
      - run: python3 clipper/investigar.py ${{ matrix.key }}
