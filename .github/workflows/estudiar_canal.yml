name: Estudiar un canal

# Saca los datos publicos de otro canal (para aprender de el) y los deja en la rama `datos`, carpeta competencia/.
on:
  workflow_dispatch:
    inputs:
      canal:
        description: 'Handle del canal, con @'
        default: '@hecho.aproposito'
  push:
    branches: ['claude/project-thread-3oui0g']
    paths: ['motor/estudiar_canal.py', '.github/workflows/estudiar_canal.yml', 'estudiar.txt']

permissions:
  contents: write

jobs:
  estudiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q google-api-python-client
      - run: git fetch origin datos && git worktree add -B datos ../datos origin/datos
      - env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CANAL: ${{ github.event.inputs.canal || '@hecho.aproposito' }}
        run: |
          [ -f estudiar.txt ] && CANAL="$(head -1 estudiar.txt)"
          python3 motor/estudiar_canal.py "$CANAL" ../datos/competencia
      - run: |
          cd ../datos
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Estudio de canal" || exit 0
          git push origin datos
