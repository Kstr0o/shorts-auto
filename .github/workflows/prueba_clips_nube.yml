name: prueba_clips_nube
# Prueba: se pueden sacar clips de Twitch sin el portatil? No sube nada a YouTube.
on:
  push:
    branches: [claude/project-thread-95x9yo]
    paths: ['.github/workflows/prueba_clips_nube.yml', 'prueba/clips_nube.py']
  workflow_dispatch:
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q yt-dlp faster-whisper
      - name: Clips, VOD, transcripcion y corte
        run: python3 prueba/clips_nube.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-clip
          path: out/
          retention-days: 3
