name: prueba_clips_nube
on:
  push:
    branches: [claude/project-thread-95x9yo]
    paths: ['.github/workflows/prueba_clips_nube.yml', 'prueba/explorar.py']
  workflow_dispatch:
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -U yt-dlp curl_cffi google-api-python-client google-auth
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_CLIPS: ${{ secrets.YT_TOKEN_CLIPS }}
        run: python3 prueba/explorar.py
