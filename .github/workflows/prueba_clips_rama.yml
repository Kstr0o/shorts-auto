name: Prueba clips (rama, no sube nada)
on:
  push:
    branches: [claude/project-thread-30eo5x]
    paths: ['.github/workflows/prueba_clips_rama.yml']
permissions:
  contents: read
jobs:
  n3on:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin clips-nube && git worktree add ../clips-nube origin/clips-nube || mkdir -p ../clips-nube
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu > /dev/null && pip install -q -U yt-dlp curl_cffi faster-whisper "opencv-python-headless<5" numpy soundfile
      - name: Candidatos de N3on (clips mas vistos de Kick)
        run: python3 clipper/nube.py preparar n3on
      - name: Plan automatico (2 mejores) y edicion
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'clipper'); import nube
          cand = {'streamers': [json.load(open('out/cand_n3on.json'))], 'fecha': nube.hoy()}
          json.dump(cand, open('out/candidatos.json', 'w'))
          p = nube.auto(cand); p['clips'] = p['clips'][:2]
          json.dump(p, open('out/plan.json', 'w'), ensure_ascii=False, indent=1)
          print(json.dumps(p, ensure_ascii=False, indent=1))
          PY
          CANDIDATOS=out/candidatos.json python3 clipper/nube.py editar n3on
      - uses: actions/upload-artifact@v4
        with:
          name: prueba-n3on
          path: |
            out/clips/
            out/cand_n3on.json
            out/plan.json
          retention-days: 3
  chat_twitch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Picos de chat nuevos (Kai Cenat y Lacy)
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'clipper'); import nube
          for k in ('kaicenat', 'lacy'):
              cfg = dict(nube.CONFIG[k], key=k)
              out = nube.picos_chat(cfg['login'], cfg, [], n=5, horas=48)
              for c in out:
                  print(k, c['vod_url'], f"{int(c['a'])//3600}h{int(c['a'])%3600//60:02d}m", json.dumps(c['chat'], ensure_ascii=False))
          PY
