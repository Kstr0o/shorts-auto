name: Prueba render con voz Qwen (temporal)

on:
  push:
    branches: [claude/project-thread-h6w1es]
    paths: ['bench_voces/render.txt']

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2
          pip install -q -r requirements.txt supertonic==1.3.1 soundfile
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu qwen-tts || echo "qwen no disponible: el ingles ira con Supertonic M5"
          mkdir -p ~/.fonts && cp assets/fuentes/*.ttf ~/.fonts/ && fc-cache -f
      - name: Renderizar
        env:
          MOTOR_VOZ: edge_tts
          VOZ_SUPERTONIC: M5
          VOZ_ES: qwen
          VOZ_TONO: misterio
        run: time python3 motor/render.py episodios/$(cat bench_voces/render.txt).json salida es en
      - name: Dejar el mp4 en la rama voces_prueba_render
        run: |
          mkdir -p /tmp/v && cp salida/*.mp4 /tmp/v/ && cd /tmp/v && git init -q -b voces_prueba_render
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Prueba render Qwen"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" voces_prueba_render
    permissions:
      contents: write
