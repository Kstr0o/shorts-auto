name: Prueba picos del directo

# Prueba en seco de `preparar` con los picos del chat (no escribe en clips-nube): imprime las ventanas de chat con su texto.
on:
  push:
    branches: ['claude/**']
    paths: ['clipper/nube.py', '.github/workflows/prueba_picos.yml']

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        key: [kaicenat, lacy, clix]
    steps:
      - uses: actions/checkout@v4
      - name: Estado (solo lectura)
        run: git fetch -q origin clips-nube && git worktree add ../clips-nube origin/clips-nube
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q -U yt-dlp curl_cffi faster-whisper numpy
      - run: python3 clipper/nube.py preparar ${{ matrix.key }}
      - run: |
          python3 - <<'PY'
          import json, glob
          for f in glob.glob('out/cand_*.json'):
              d = json.load(open(f))
              for v in d['ventanas']:
                  if v.get('origen') == 'chat':
                      print('PICO', json.dumps({'id': v['id'], 'chat': v['chat'], 'texto': ' '.join(x[2] for x in v.get('frases', []))[:700]}, ensure_ascii=False))
          PY
