name: Prueba picos del directo

# Prueba de viabilidad, solo lectura (clipper/prueba_picos.py). Se lanza al tocar el script en la rama de trabajo.
on:
  push:
    branches: ['claude/**']
    paths: ['clipper/prueba_picos.py', '.github/workflows/prueba_picos.yml']

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        login: [kaicenat, lacy]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q -U yt-dlp curl_cffi faster-whisper numpy
      - run: python3 clipper/prueba_picos.py ${{ matrix.login }}
