name: Prueba de voces en CPU (temporal)

on:
  push:
    branches: [claude/project-thread-h6w1es]
    paths: ['bench_voces/**', '.github/workflows/prueba_voces_bench.yml']

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        motor: [qwen_es]
        variante: [a, b, c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng sox
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -q soundfile numpy
          case "${{ matrix.motor }}" in
            supertonic) pip install -q supertonic==1.3.1 ;;
            edge) pip install -q edge-tts ;;
            kokoro) pip install -q "kokoro>=0.9.4" "misaki[en]" ;;
            qwen06|qwen17|qwen_es) pip install -q --extra-index-url https://download.pytorch.org/whl/cpu qwen-tts ;;
            voxcpm) pip install -q --extra-index-url https://download.pytorch.org/whl/cpu voxcpm ;;
          esac
      - name: Generar
        working-directory: bench_voces
        env:
          VARIANTE: ${{ matrix.variante }}
        run: nproc && python bench.py ${{ matrix.motor }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voces-${{ matrix.motor }}-${{ matrix.variante }}
          path: bench_voces/salida/
