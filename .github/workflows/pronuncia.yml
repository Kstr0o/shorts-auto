name: Probar pronunciacion

on:
  workflow_dispatch:
    inputs:
      palabras:
        description: 'Palabras de _es_pendiente_de_probar o _es_rr_experimental a probar, separadas por comas (vacio = todas)'
        default: ''

permissions:
  contents: write

jobs:
  pronuncia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2
          pip install -q -r requirements.txt
          pip install -q --no-cache-dir torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q --no-cache-dir chatterbox-tts faster-whisper
      - name: Generar
        env:
          PALABRAS: ${{ github.event.inputs.palabras }}
        run: python3 motor/probar_pronuncia.py salida "$PALABRAS" 2>&1 | tee salida_log.txt
      - name: Dejar el resultado en la rama pronuncia
        run: |
          mkdir -p /tmp/p && cp salida/pronuncia_es.* salida_log.txt /tmp/p/
          cd /tmp/p && git init -q -b pronuncia
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Prueba de pronunciacion"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pronuncia
