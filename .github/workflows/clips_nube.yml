name: Clips en la nube

# Canal de clips (Daily Streamer Clips) sin portatil. Cada noche, hora de Madrid (invierno):
#   21:00  preparar: clips mas vistos de la semana de cada streamer -> tramos del VOD -> transcripcion -> rama clips-nube
#   21:45  Claude (tarea programada) elige momentos y titulos -> clips-nube/momentos.json -> lanza la fase editar
#   23:30  editar (por si Claude no llego): corte del VOD, edicion, subida ya programada (publishAt)
# Detalle en clipper/nube.py. El estado (candidatos, programados, usados, pendientes) vive en la rama clips-nube.
on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      fase:
        description: 'preparar | editar | todo (preparar y editar seguidos, con momentos automaticos) | reavisar (repite los avisos al movil de lo que falta por publicar) | pies (repite ya el pie de TikTok de los borradores; streamers = texto del titulo, p. ej. kai) | revisar (pregunta a TikTok si los borradores de los ultimos 3 dias entraron en la bandeja) | prueba (manda un video de prueba de 5 s a la bandeja)'
        default: editar
      streamers:
        description: 'claves separadas por comas (vacio = todos)'
        default: ''
      simular:
        description: 'true = no sube nada'
        default: 'false'
      momentos:
        description: 'opcional: momentos.json en base64 (gzip o plano). Lo usa la tarea de Claude, que no puede escribir en clips-nube'
        default: ''

permissions:
  contents: write

concurrency:
  group: clips-nube
  cancel-in-progress: false

env:
  PIP_PAQUETES: yt-dlp curl_cffi faster-whisper opencv-python-headless<5 numpy soundfile pillow google-api-python-client google-auth

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      fase: ${{ steps.c.outputs.fase }}
      streamers: ${{ steps.c.outputs.streamers }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            if [ "${{ github.event.schedule }}" = '0 20 * * *' ]; then fase=preparar; else fase=editar; fi
            # GitHub llega a retrasar los cron 4-5 h: una ejecucion tardia de madrugada subiria clips automaticos
            # (titulos feos) encima de la tanda buena. La preparacion ya la lanza una tarea a las 20:47; los cron
            # solo valen dentro de su franja (Madrid): preparar 21-22 h, editar 23-00 h.
            h=$(TZ=Europe/Madrid date +%H)
            if [ $fase = preparar ] && [ $h != 21 ] && [ $h != 22 ]; then echo "cron tardio ($h h): no hago nada"; fase=nada; fi
            if [ $fase = editar ] && [ $h != 23 ] && [ $h != 00 ]; then echo "cron tardio ($h h): no hago nada"; fase=nada; fi
          else fase="${{ inputs.fase }}"; fi
          echo "fase=$fase" >> "$GITHUB_OUTPUT"
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          todos = [k for k, v in json.load(open('clipper/streamers_nube.json')).items() if v.get('activo', True)]
          pedidos = [s.strip() for s in os.environ.get('PEDIDOS', '').split(',') if s.strip()]
          print('streamers=' + json.dumps([s for s in todos if not pedidos or s in pedidos]))
          EOF
          echo "fase: $fase"
        env:
          PEDIDOS: ${{ inputs.streamers }}

  preparar:
    needs: config
    if: needs.config.outputs.fase == 'preparar' || needs.config.outputs.fase == 'todo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        key: ${{ fromJSON(needs.config.outputs.streamers) }}
    steps:
      - uses: actions/checkout@v4
      - name: Estado (rama clips-nube)
        run: git fetch -q origin clips-nube && git worktree add ../clips-nube origin/clips-nube || mkdir -p ../clips-nube
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q -U $PIP_PAQUETES
      - run: python3 clipper/nube.py preparar ${{ matrix.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: cand-${{ matrix.key }}
          path: 'out/cand_*.json'
          retention-days: 2

  juntar:
    needs: [config, preparar]
    if: always() && needs.preparar.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: 'cand-*'
          path: cand
          merge-multiple: true
      - name: Juntar y guardar en clips-nube
        run: |
          git fetch -q origin clips-nube && git worktree add -B clips-nube ../clips-nube origin/clips-nube \
            || git worktree add --orphan -b clips-nube ../clips-nube
          python3 clipper/nube.py juntar cand/*.json
          cd ../clips-nube && git config user.name shorts-bot && git config user.email shorts-bot@users.noreply.github.com
          git add -A && git commit -qm "candidatos $(date -u +%F)" && git push -q origin clips-nube || echo "sin cambios"
          exit ${fallo:-0}

  plan:
    needs: [config, juntar]
    if: always() && (needs.config.outputs.fase == 'editar' || (needs.config.outputs.fase == 'todo' && needs.juntar.result == 'success'))
    runs-on: ubuntu-latest
    outputs:
      streamers: ${{ steps.p.outputs.streamers }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-api-python-client google-auth
      - id: p
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_CLIPS: ${{ secrets.YT_TOKEN_CLIPS }}
          MOMENTOS_B64: ${{ inputs.momentos }}
        run: |
          git fetch -q origin clips-nube && git worktree add -B clips-nube ../clips-nube origin/clips-nube
          if [ -n "$MOMENTOS_B64" ]; then
            printf '%s' "$MOMENTOS_B64" | base64 -d > /tmp/mom.bin
            if gzip -t /tmp/mom.bin 2>/dev/null; then gzip -dc /tmp/mom.bin > /tmp/mom.json; else cp /tmp/mom.bin /tmp/mom.json; fi
            python3 -c "import json;d=json.load(open('/tmp/mom.json'));assert d.get('clips') and d.get('creado');print('momentos recibidos:',len(d['clips']),'clips, creado',d['creado'])"
            cp /tmp/mom.json ../clips-nube/momentos.json
            # la seleccion de Claude de esta noche manda: fuera los pendientes viejos (automaticos) que le quitarian los huecos
            echo '[]' > ../clips-nube/pendientes.json
          fi
          python3 clipper/nube.py plan ${{ needs.config.outputs.fase == 'todo' && '--auto' || '' }}
          echo "streamers=$(python3 -c "import json;print(json.dumps(json.load(open('out/plan.json'))['streamers']))")" >> "$GITHUB_OUTPUT"
          cd ../clips-nube && git config user.name shorts-bot && git config user.email shorts-bot@users.noreply.github.com
          git add -A && git commit -qm "plan $(date -u +%F)" && git push -q origin clips-nube || echo "sin cambios"
          exit ${fallo:-0}
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: out/plan.json
          retention-days: 2

  editar:
    needs: plan
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.streamers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        key: ${{ fromJSON(needs.plan.outputs.streamers) }}
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin clips-nube && git worktree add ../clips-nube origin/clips-nube
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: out
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q -U $PIP_PAQUETES
      - run: python3 clipper/nube.py editar ${{ matrix.key }}
        env:
          CANDIDATOS: ../clips-nube/candidatos.json
      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.key }}
          path: out/clips/
          retention-days: 2

  subir:
    needs: [plan, editar]
    if: always() && needs.editar.result != 'skipped' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: 'clips-*'
          path: out/clips
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: out
      - run: pip install -q google-api-python-client google-auth
      - name: Subir programado
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_CLIPS: ${{ secrets.YT_TOKEN_CLIPS }}
          AVISO_TEMA: ${{ secrets.AVISO_TEMA }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          git fetch -q origin clips-nube && git worktree add -B clips-nube ../clips-nube origin/clips-nube
          python3 clipper/nube.py subir out/clips ${{ inputs.simular == 'true' && '--simular' || '' }}
          if [ "${{ inputs.simular }}" != true ]; then python3 clipper/tiktok.py subir out/clips || echo "TikTok fallo (YouTube ya esta subido)"; fi
          cd ../clips-nube && git config user.name shorts-bot && git config user.email shorts-bot@users.noreply.github.com
          git add -A && git commit -qm "programados $(date -u +%F)" && git push -q origin clips-nube || echo "sin cambios"
          exit ${fallo:-0}

  reavisar:
    needs: config
    if: needs.config.outputs.fase == 'reavisar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin clips-nube && git worktree add ../clips-nube origin/clips-nube
      - run: python3 clipper/nube.py reavisar
        env:
          AVISO_TEMA: ${{ secrets.AVISO_TEMA }}

  pies:
    needs: config
    if: needs.config.outputs.fase == 'pies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin clips-nube && git worktree add ../clips-nube origin/clips-nube
      - run: python3 clipper/tiktok.py pies "$FILTRO"
        env:
          AVISO_TEMA: ${{ secrets.AVISO_TEMA }}
          FILTRO: ${{ inputs.streamers }}

  revisar:
    needs: config
    if: needs.config.outputs.fase == 'revisar' || needs.config.outputs.fase == 'prueba'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estado de los borradores en TikTok
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          git fetch -q origin clips-nube && git worktree add -B clips-nube ../clips-nube origin/clips-nube
          python3 clipper/tiktok.py ${{ needs.config.outputs.fase }} || fallo=1
          cd ../clips-nube && git config user.name shorts-bot && git config user.email shorts-bot@users.noreply.github.com
          git add -A && git commit -qm "tiktok revisar $(date -u +%F)" && git push -q origin clips-nube || echo "sin cambios"
          exit ${fallo:-0}
