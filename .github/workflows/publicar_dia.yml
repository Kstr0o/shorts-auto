name: Publicar el video del dia

on:
  # Programacion automatica en pausa desde el 13/11: mientras Google no audite la app, los videos se suben y
  # se programan a mano desde YouTube Studio. Para reactivarla, quitar los # de las tres lineas siguientes.
  # schedule:
  #   - cron: '0 12 * * *'   # 13:00 hora de Madrid (invierno): 1 video por canal
  #   - cron: '0 18 * * *'   # 19:00 hora de Madrid: segundo video del dia solo en los canales de ciencia
  workflow_dispatch:

permissions:
  contents: write

concurrency: publicar-dia

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SOLO_SERIE: ${{ github.event.schedule == '0 18 * * *' && 'ysi' || '' }}
      HORA_EN: ${{ github.event.schedule == '0 18 * * *' && '20' || '14' }}
      YT_PRIVACIDAD: ${{ vars.YT_PRIVACIDAD || 'private' }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_TOKEN_TONI_ES: ${{ secrets.YT_TOKEN_TONI_ES }}
      YT_TOKEN_TONI_EN: ${{ secrets.YT_TOKEN_TONI_EN }}
      YT_TOKEN_YSI_ES: ${{ secrets.YT_TOKEN_YSI_ES }}
      YT_TOKEN_YSI_EN: ${{ secrets.YT_TOKEN_YSI_EN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: listos
          path: listos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q google-api-python-client google-auth
      - name: Subir
        run: python3 motor/publicar_dia.py
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add estado.json && git commit -m "Actualizar estado de publicacion" || true
          git push
