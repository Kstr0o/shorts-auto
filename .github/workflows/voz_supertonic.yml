name: Voz Supertonic
on:
  push:
    branches: [voz_lote]
    paths: ['voz_in/**']
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q supertonic==1.3.1 soundfile numpy
      - run: python3 motor/voz_supertonic.py
      - run: |
          git config user.name shorts-bot && git config user.email shorts-bot@users.noreply.github.com
          git add voz_out && git commit -qm "Voces Supertonic M5" && git push -q origin voz_lote
