name: TikTok - guardar autorizacion

# Una sola vez (o si TikTok pide volver a autorizar): pega aqui el codigo que sale en la pagina tiktok-callback.
# El token se guarda CIFRADO en la rama clips-nube (tiktok_token.enc); nunca sale en el log.
on:
  workflow_dispatch:
    inputs:
      codigo:
        description: 'codigo de la pagina de autorizacion de TikTok (caduca en minutos)'
        required: true

permissions:
  contents: write

concurrency:
  group: clips-nube
  cancel-in-progress: false

jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cambiar codigo por token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          CODIGO: ${{ inputs.codigo }}
        run: |
          git fetch -q origin clips-nube && git worktree add -B clips-nube ../clips-nube origin/clips-nube
          python3 clipper/tiktok.py token "$CODIGO"
          cd ../clips-nube && git config user.name shorts-bot && git config user.email shorts-bot@users.noreply.github.com
          git add tiktok_token.enc && git commit -qm "token TikTok" && git push -q origin clips-nube
