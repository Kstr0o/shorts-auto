name: TikTok - guardar autorizacion

# Una sola vez (o si TikTok pide volver a autorizar): pega aqui el codigo que sale en la pagina tiktok-callback.
# El token se guarda CIFRADO en la rama elegida (clips-nube o podcasts-nube, tiktok_token.enc); nunca sale en el log.
on:
  workflow_dispatch:
    inputs:
      codigo:
        description: 'codigo de la pagina de autorizacion de TikTok (caduca en minutos)'
        required: true
      rama:
        description: 'cuenta: clips-nube (Daily Streamer Clips) o podcasts-nube (canal de podcasts)'
        default: clips-nube

permissions:
  contents: write

concurrency:
  group: clips-nube
  cancel-in-progress: false

jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cambiar codigo por token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          CODIGO: ${{ inputs.codigo }}
          RAMA: ${{ inputs.rama }}
        run: |
          case "$RAMA" in clips-nube|podcasts-nube) ;; *) echo "rama no valida"; exit 1;; esac
          git fetch -q origin $RAMA && git worktree add -B $RAMA ../$RAMA origin/$RAMA
          python3 clipper/tiktok.py token --estado ../$RAMA -- "$CODIGO"
          cd ../$RAMA && git config user.name shorts-bot && git config user.email shorts-bot@users.noreply.github.com
          git add tiktok_token.enc && git commit -qm "token TikTok" && git push -q origin $RAMA
